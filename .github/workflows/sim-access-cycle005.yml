name: Cycle 005 typed synthetic mobile access conformance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SLICKK_ENV: sandbox
      SLICKK_ENABLE_CHECKOUTS: 'false'
      SLICKK_GATEWAY_LIVE: 'false'
      SLICKK_REGULATORY_SIGNOFF: 'false'
      SLICKK_SIM_ACCESS_ENABLED: 'true'
    defaults:
      run:
        working-directory: clients/simaccess-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --no-package-lock --ignore-scripts
      - name: Strict TypeScript compile and synthetic contract tests
        run: npm test
      - name: Ensure no production financial credentials in mobile SDK
        run: |
          ! grep -R -n -E 'SSLCOMMERZ_STORE_PASSWD|DATABASE_READ_URL|SLICKK_GATEWAY_LIVE=true' src
          ! grep -R -n -E '/v1/(gateway|payments)/ipn' src
  python-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SLICKK_ENV: sandbox
      SLICKK_ENABLE_CHECKOUTS: 'false'
      SLICKK_GATEWAY_LIVE: 'false'
      SLICKK_REGULATORY_SIGNOFF: 'false'
      SLICKK_SIM_ACCESS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check real Cycle 004 FastAPI local contract
        run: python -m scripts.verify_cycle005_contract
      - name: Preserve Cycle 004 security test baseline
        run: python -m unittest discover -s tests -p 'test_simaccess_*cycle004.py' -q
