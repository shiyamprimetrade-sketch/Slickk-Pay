name: Cycle 002 disposable PostgreSQL and TypeScript contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: slickk_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d slickk_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      SLICKK_PG_SANDBOX: "true"
      SLICKK_ENV: staging
      SLICKK_GATEWAY_LIVE: "false"
      SLICKK_REGULATORY_SIGNOFF: "false"
      SLICKK_PG_TEST_DATABASE_URL: postgresql+psycopg://lab:fictional-ci-only@127.0.0.1:5432/slickk_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run sandbox migration and concurrency probes
        run: python scripts/verify_cycle002_pg.py
      - name: Regression tests
        run: python -m unittest discover -s tests -q

  typescript-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/inspection-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned compiler
        run: npm install --no-package-lock --ignore-scripts
      - name: Strict TypeScript compile and contract tests
        run: npm test
