name: Disposable PostgreSQL migration verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slickk_ci
          POSTGRES_PASSWORD: ci-local-password-only
          POSTGRES_DB: slickk_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slickk_ci -d slickk_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate test target guardrails
        run: python -m unittest tests.test_migration_target_guard -v
      - name: Run migration against disposable PostgreSQL
        env:
          CI: 'true'
          SLICKK_EPHEMERAL_DB_TEST: 'true'
          SLICKK_CI_DATABASE_URL: postgresql://slickk_ci:ci-local-password-only@127.0.0.1:5432/slickk_ci_test
        run: python scripts/verify_postgres_migration_ci.py
